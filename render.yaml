# Render blueprint for Search Vailable.
#
# This runs the full Express server (crawler + auth + billing + static frontend)
# on one URL, so the frontend's relative /api/... calls work.
#
# Notes:
# - Requires Node 24: storage is SQLite via the built-in node:sqlite module.
# - The disk below makes user/payment data survive restarts and deploys.
#   Render disks require a paid instance type. On the free tier, remove the
#   `disk:` block and `DATA_DIR` env var — the app still runs, but data resets
#   when the service restarts.
# - Set the secret values in the Render dashboard (marked sync: false).
services:
  - type: web
    name: search-vailable
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: PAYMENT_MODE
        value: sandbox
      - key: APP_URL
        sync: false
      - key: PAYNOW_INTEGRATION_ID
        sync: false
      - key: PAYNOW_INTEGRATION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_ENGINE_ID
        sync: false
    disk:
      name: search-vailable-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
