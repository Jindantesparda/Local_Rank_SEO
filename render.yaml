# Render blueprint for Search Vailable — free tier + Turso.
#
# Runs the full Express server (crawler + auth + billing + static frontend) on
# one URL, so the frontend's relative /api/... calls work.
#
# Why not Vercel: this app needs a long-lived process (the monitoring scheduler),
# a persistent database, and multi-page crawls that can take 10+ seconds.
# Serverless has none of those.
#
# Why Turso and no disk: Render's free tier has no persistent disk, so a local
# SQLite file would be wiped on every restart and deploy. The database lives in
# Turso instead, so data survives — and costs nothing.
#
# IMPORTANT — Render free services SLEEP after ~15 minutes without traffic,
# which stops the in-process monitoring scheduler. The GitHub Actions workflow in
# .github/workflows/monitor.yml pings /api/monitor/run hourly to keep automated
# monitoring working. Without it, paid-plan monitoring silently stops.
services:
  - type: web
    name: search-vailable
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # Custom domain, provisioned by the blueprint. Render will ask you to add
    # these DNS records in Cloudflare:
    #   CNAME  @    →  <service>.onrender.com
    #   CNAME  www  →  <service>.onrender.com
    domains:
      - searchvailable.com
      - www.searchvailable.com
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production

      # --- Database (required) -------------------------------------------
      # Create a free database at https://turso.tech, then:
      #   turso db show <db> --url          → TURSO_DATABASE_URL
      #   turso db tokens create <db>       → TURSO_AUTH_TOKEN
      # Without these the app falls back to a local file, which on Render free
      # means data is lost on every restart.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

      # Public URL of this service. Without it every verification and
      # password-reset email links to http://localhost:3000 and is dead on
      # arrival. Keep this in step with the custom domain above.
      - key: APP_URL
        value: https://searchvailable.com
      - key: PAYMENT_CALLBACK_URL
        value: https://searchvailable.com/api/billing

      - key: PAYMENT_MODE
        value: sandbox

      # Token for the monitoring cron (.github/workflows/monitor.yml), so
      # scheduled monitoring does not depend on a session that expires every 30
      # days. Generate one with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      # and set the same value as the MONITOR_TOKEN GitHub Actions secret.
      - key: MONITOR_TOKEN
        sync: false

      # How many proxies sit in front of the app. This feeds req.ip, which the
      # auth rate limiter is keyed on:
      #   1  Render direct, or Cloudflare with the record set to "DNS only"
      #   2  Cloudflare proxied (orange cloud) in front of Render
      # Get it wrong and every visitor shares one bucket, so 30 failed logins
      # lock out the whole app. Verify with: curl <domain>/api/health
      - key: TRUST_PROXY
        value: "1"

      # --- Optional integrations. Leave unset and the app degrades honestly. ---
      # Google service account (JSON) — powers Analytics and Search Console.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # Brave Search — competitor search visibility (not Google results).
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      # Resend — confirmation, password reset and monitoring emails.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Gemini — AI-written wording. New keys need gemini-3.6-flash.
      - key: GEMINI_API_KEY
        sync: false
      # Paynow — live payments (PAYMENT_MODE=live).
      - key: PAYNOW_INTEGRATION_ID
        sync: false
      - key: PAYNOW_INTEGRATION_KEY
        sync: false
